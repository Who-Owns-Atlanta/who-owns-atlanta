<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Icon Preview</title>
  <style>
    body { background: #888; font-family: sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 48px; }
    section { display: flex; flex-direction: column; gap: 16px; }
    h2 { color: #fff; margin: 0; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    .row { display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap; }
    .swatch { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .swatch span { color: #eee; font-size: 11px; }
    /* Show transparency by checkerboard */
    .checker { background-image:
      linear-gradient(45deg, #aaa 25%, transparent 25%),
      linear-gradient(-45deg, #aaa 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #aaa 75%),
      linear-gradient(-45deg, transparent 75%, #aaa 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0px;
      background-color: #eee;
      padding: 8px;
      border-radius: 4px;
    }
    .on-white { background: #fff; padding: 8px; border-radius: 4px; }
    .on-dark  { background: #111; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <section>
    <h2>512px — on checker / white / dark</h2>
    <div class="row">
      <div class="swatch"><div class="checker"><img src="img/icon-512.png" width="512" height="512"></div><span>512 transparent</span></div>
    </div>
    <div class="row">
      <div class="swatch"><div class="on-white"><img src="img/icon-512.png" width="512" height="512"></div><span>on white</span></div>
      <div class="swatch"><div class="on-dark"><img src="img/icon-512.png" width="512" height="512"></div><span>on dark</span></div>
    </div>
  </section>

  <section>
    <h2>192px</h2>
    <div class="row">
      <div class="swatch"><div class="checker"><img src="img/icon-192.png" width="192" height="192"></div><span>192</span></div>
      <div class="swatch"><div class="on-white"><img src="img/icon-192.png" width="192" height="192"></div><span>on white</span></div>
      <div class="swatch"><div class="on-dark"><img src="img/icon-192.png" width="192" height="192"></div><span>on dark</span></div>
    </div>
  </section>

  <section>
    <h2>Favicons — 48 / 32 / 16</h2>
    <div class="row">
      <div class="swatch"><div class="checker"><img src="img/favicon-32.png" width="48" height="48"></div><span>32px @ 1.5×</span></div>
      <div class="swatch"><div class="checker"><img src="img/favicon-32.png" width="32" height="32"></div><span>32px</span></div>
      <div class="swatch"><div class="checker"><img src="img/favicon-16.png" width="32" height="32"></div><span>16px @ 2×</span></div>
      <div class="swatch"><div class="checker"><img src="img/favicon-16.png" width="16" height="16"></div><span>16px</span></div>
    </div>
    <div class="row">
      <div class="swatch"><div class="on-white"><img src="img/favicon-32.png" width="32" height="32"></div><span>32 on white</span></div>
      <div class="swatch"><div class="on-dark"><img src="img/favicon-32.png" width="32" height="32"></div><span>32 on dark</span></div>
      <div class="swatch"><div class="on-white"><img src="img/favicon-16.png" width="16" height="16"></div><span>16 on white</span></div>
      <div class="swatch"><div class="on-dark"><img src="img/favicon-16.png" width="16" height="16"></div><span>16 on dark</span></div>
    </div>
  </section>

  <section>
    <h2>Rounded-square (CSS border-radius, Apple-style)</h2>
    <div class="row">
      <div class="swatch">
        <div class="on-dark" style="border-radius:0; padding:0; overflow:hidden; width:512px; height:512px; border-radius: 112px;">
          <img src="img/icon-512.png" width="512" height="512">
        </div>
        <span>512 rounded</span>
      </div>
      <div class="swatch">
        <div class="on-dark" style="padding:0; overflow:hidden; width:192px; height:192px; border-radius: 42px;">
          <img src="img/icon-192.png" width="192" height="192">
        </div>
        <span>192 rounded</span>
      </div>
    </div>
  </section>

</body>
</html>
