# Dev vhost — plain HTTP, no SSL, no rate limiting
# Add to /etc/nginx/sites-enabled/ and add who-owns-atlanta.local to /etc/hosts
#
# /etc/hosts entry:
#   127.0.0.1  who-owns-atlanta.local

server {
    listen 80;
    server_name who-owns-atlanta.local;

    root /var/www/who-owns-atlanta/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
