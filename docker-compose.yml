services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: woa_postgis
    environment:
      POSTGRES_DB: who_owns_atl
      POSTGRES_USER: woa
      POSTGRES_PASSWORD: woa
    ports:
      - "5434:5432"
    volumes:
      - woa_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  woa_pgdata:
